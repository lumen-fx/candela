[package]
name = "candela-lsp"
version = "0.1.0"
edition = "2024"
description = "Language server for the Candela language (.cdl files)"
license = "Apache-2.0"
publish = false

# This crate is a workspace member of the root candela/Cargo.toml (a
# one-way dependency: candela-lsp -> candela, never the reverse), so the
# `candela` interpreter binary never sees tower-lsp/tokio/lsp-types in its
# dependency graph or build. See the root Cargo.toml's [workspace] comment.
#
# BUILD NOTE: this crate's diagnostics pass goes through
# candela::collect_diagnostic, which recovers an error by catching an internal
# unwind. Every profile in the workspace unwinds, `release` included, so any of
# them builds a server that reports. A profile that set `panic = "abort"` would
# turn the first parse or type error in a user's buffer into a dead LSP
# process.

[dependencies]
# `package = "candela-lang"` is the crates.io name; the import stays `candela`.
candela = { package = "candela-lang", path = ".." }
tower-lsp = "0.20.0"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }
serde_json = "1"
dashmap = "6"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "macros", "process", "time"] }

[[bin]]
name = "candela-lsp"
path = "src/main.rs"
