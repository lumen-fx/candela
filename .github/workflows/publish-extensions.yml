name: publish-extensions

# Ships the editor extensions on release: the VS Code extension to the
# marketplace and Open VSX, the JetBrains plugin to its marketplace. Every
# publish step checks its token and skips with a notice when it is absent,
# so the workflow is safe before the accounts exist. The first JetBrains
# upload is manual by marketplace rule; this takes over from the second.
#
# release.yml calls this rather than a `release: published` trigger starting
# it. The release is created with the workflow token and a workflow token
# raises no events, so a trigger here would wait for something that never
# arrives.
#
# Only a vX.Y.Z tag uploads anything. A called run carries the caller's ref,
# and release.yml runs on that tag alone. Every other ref packages the
# extensions and stops there: the rolling `nightly` tag is a build of main
# rather than a version, and a branch is whatever it is between releases.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time per ref. Two runs would build the same extension
# version twice and race to upload it, and a marketplace takes a version once,
# so the loser fails on a version that is already there.
concurrency:
  group: publish-extensions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - run: npx @vscode/vsce package

      - name: publish to the marketplace
        run: |
          if [ "$RELEASE_TAG" != "true" ]; then echo "$GITHUB_REF_NAME is not a release tag; skipping"; exit 0; fi
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT absent; skipping"; exit 0; fi
          npx @vscode/vsce publish --packagePath ./*.vsix -p "$VSCE_PAT"

      - name: publish to open vsx
        run: |
          if [ "$RELEASE_TAG" != "true" ]; then echo "$GITHUB_REF_NAME is not a release tag; skipping"; exit 0; fi
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_TOKEN absent; skipping"; exit 0; fi
          npx ovsx publish ./*.vsix -p "$OVSX_PAT"

  jetbrains:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/jetbrains
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: publish to the jetbrains marketplace
        run: |
          if [ "$RELEASE_TAG" != "true" ]; then echo "$GITHUB_REF_NAME is not a release tag; skipping"; exit 0; fi
          if [ -z "$PUBLISH_TOKEN" ]; then echo "JETBRAINS_PUBLISH_TOKEN absent; skipping"; exit 0; fi
          ./gradlew --no-daemon publishPlugin
