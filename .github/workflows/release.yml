name: release

# Publishes the candela toolchain, and the first-party packages built from the
# same tag, to a GitHub release on any vX.Y.Z tag.
#
# The assets come from build-artifacts.yml, which nightly.yml calls too. What
# is here is the part only a tag does: check the tag against the manifest,
# publish the release, send the crates and the editor extensions out after it,
# and move main to the next version, so pushing the tag is the whole of cutting
# a release and there is nothing left to type afterwards.
#
# publish.yml and publish-extensions.yml are called from here rather than
# started by the release they follow. The release is created with the workflow
# token and a workflow token raises no events, so neither would ever hear about
# it. Calling them keeps them on this run's ref, which is the tag, so both read
# the version that was released rather than the one main moves to below.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Every artifact is named after the tag and versioned from the manifest, so a
  # tag that disagrees with the manifest ships a package claiming a version the
  # binary does not report. This gates the build rather than running inside it,
  # so a disagreement costs one runner instead of every leg of the matrix.
  #
  # Both binaries ship in the same archive and report their own version, so
  # vm/Cargo.toml is checked alongside the root manifest. The version is read
  # out of the `[package]` table rather than off a line number, which a comment
  # above it moves.
  version:
    name: check the tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Read the version off the tag
        id: read
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest_path in Cargo.toml vm/Cargo.toml; do
            manifest="$(awk -F'"' '
              /^\[package\]/ { in_section = 1; next }
              /^\[/          { in_section = 0 }
              in_section && /^version[[:space:]]*=/ { print $2; exit }
            ' "$manifest_path")"
            if [ "$tag" != "$manifest" ]; then
              echo "Tag $GITHUB_REF_NAME is version '$tag', but $manifest_path says '$manifest'."
              echo "Run scripts/bump-version.py $tag, or retag, so the two agree."
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  artifacts:
    name: build
    needs: version
    uses: ./.github/workflows/build-artifacts.yml
    with:
      msi_version: ${{ needs.version.outputs.version }}

  release:
    name: publish release
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      # The whole history, for the tags: the notes name the release before this
      # one.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The breaking changes this release carries, read from the migration
      # notes in the tag's tree. Empty when there are none, and the body is then
      # the generated notes alone.
      - name: Write the migration notes
        run: scripts/migration-notes.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/migration-notes.md"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.msi
            artifacts/sha256sums.txt
          # GitHub puts the generated list of pull requests after this body.
          body_path: ${{ runner.temp }}/migration-notes.md
          generate_release_notes: true

  # The other two channels a release goes out on. Both run at this run's ref,
  # so the tree they read and the version they claim are the tagged ones. Each
  # keeps its workflow_dispatch, so a leg that fails is re-run by hand against
  # the tag without re-running the release.
  crates:
    name: publish the crates
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      dry_run: false
    secrets: inherit

  extensions:
    name: publish the editor extensions
    needs: release
    uses: ./.github/workflows/publish-extensions.yml
    secrets: inherit

  # The first-party packages are on the release page now, built from this tag
  # by build-artifacts.yml at the version the tag names: the packages version
  # in lockstep with candela, and each asks for the candela that released it,
  # since the event seam they post through arrives in that release. This tells
  # the registry where each archive is, one `lpm release` per package, under
  # the account that owns their names, whose token is the LPM_TOKEN secret.
  #
  # A package that fails does not stop the others, and the job fails at the
  # end naming it. A re-run asks again for every package, so one the registry
  # already took at this version fails again there; read which failed for the
  # first time before re-running.
  registry:
    name: release the packages to the registry
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # The registry client comes from the toolchain installer, which resolves
      # and verifies it exactly as candela itself does.
      - name: Install candela and the registry client
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL https://candela.lumenfx.dev/install.sh |
            sh -s -- --version "$VERSION" --no-confirm --no-modify-path
          echo "$HOME/.candela" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tell the registry where each package is
        shell: bash
        env:
          LPM_TOKEN: ${{ secrets.LPM_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${LPM_TOKEN:-}" ]; then
            echo "no LPM_TOKEN secret; the packages are on the release page but the registry was not told" >&2
            exit 1
          fi

          # lpm reads its token from the config file `lpm login` writes, so
          # this writes one, unreadable to anyone else, and removes it when the
          # step ends. The same as build-package.yml does.
          config_dir="$RUNNER_TEMP/lpm"
          rm -rf "$config_dir"
          mkdir -p "$config_dir"
          chmod 700 "$config_dir"
          trap 'rm -rf "$config_dir"' EXIT INT TERM
          (
            umask 077
            printf '{"registry": "%s", "token": "%s"}\n' \
              "https://reg.lumenfx.dev" "$LPM_TOKEN" \
              > "$config_dir/config.json"
          )
          export LPM_CONFIG_DIR="$config_dir"

          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          failed=()
          for manifest in packages/*/candela.toml; do
            name="$(basename "$(dirname "$manifest")")"
            description="$(awk -F'"' '/^description[[:space:]]*=/ { print $2; exit }' "$manifest")"
            version="$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' "$manifest")"
            if [ "$version" != "$VERSION" ]; then
              echo "$manifest is at $version and the tag at $VERSION; run scripts/bump-version.py" >&2
              failed+=("$name")
              continue
            fi

            args=()
            for asset in $(printf '%s\n' "$assets" | grep -E "^${name}-[a-z0-9_-]+\.tar\.gz$"); do
              target="${asset#"$name"-}"
              target="${target%.tar.gz}"
              args+=(--artifact "$target=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset")
            done
            if [ "${#args[@]}" -eq 0 ]; then
              echo "the release carries no archive for $name" >&2
              failed+=("$name")
              continue
            fi

            # The name is claimed already; a claim the registry refuses as
            # taken is the answer this wanted. Anything else is a failure.
            if ! lpm publish "$name" --platform candela --description "$description" 2> publish.err; then
              if ! grep -qiE 'package name is already taken|the registry answered 409' publish.err; then
                cat publish.err >&2
                failed+=("$name")
                continue
              fi
            fi
            if ! lpm release "$name" "$VERSION" "${args[@]}" --requires "candela@>=$VERSION" -d "$description"; then
              failed+=("$name")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "not released to the registry: ${failed[*]}" >&2
            exit 1
          fi

  # Cutting a release is a tag push and nothing else, so the version main
  # carries has to move afterwards on its own. This commits that move straight
  # to main, which leaves a release asking nothing of anyone once the tag is
  # pushed.
  #
  # The same commit files the release's migration notes. The notes in
  # docs/migration/unreleased/ of the tag's tree are the ones this release
  # shipped, and scripts/release-fragments.sh moves exactly those into
  # docs/migration/<tag>/. A note merged to main after the tag is not in that
  # tree, so it stays unreleased and goes out with the next release. The move
  # happens even when main is already at the next version, since leaving the
  # notes behind would credit them to the next release; it is then committed on
  # its own.
  #
  # It pushes over SSH with the BUMP_DEPLOY_KEY deploy key rather than with the
  # workflow token, for two reasons. A deploy key is a bypass actor the main
  # ruleset names, so the push is allowed where the token's would be refused;
  # and a push made with the workflow token raises no events, so the bump
  # commit would land on main without a ci run behind it.
  #
  # The next version is always the next patch. Nothing here can know whether the
  # work after this release is a fix or a feature, and being predictable is
  # worth more than being right: a number that is always one patch ahead is
  # corrected by one more commit, while a number that follows a rule somebody
  # has to remember is not. Tags in any other shape, a prerelease among them,
  # are left alone, because incrementing one is a decision rather than an
  # increment. Their migration notes stay unreleased too: a prerelease is never
  # the release the docs site builds from, so the notes belong to the plain
  # vX.Y.Z that follows it.
  #
  # Re-running the workflow after fixing a build leg reaches this job again, and
  # finds main already at the next version with the notes already filed, so it
  # stops before it commits anything. The same check is what keeps a re-run of
  # an older release from walking main backwards, and it is read off main each
  # time round rather than off the tree this run started with.
  #
  # The push is never forced. A main that moved under a long build refuses the
  # push instead of losing the commit that moved it, and the retry takes main
  # again and re-decides on top of it.
  #
  # Only main moves here, and it moves alongside the two publish legs rather
  # than after them. Both run at the tag, so neither notices main moving under
  # them.
  bump:
    name: move main to the next version
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Commit the next version to main
        env:
          DEPLOY_KEY: ${{ secrets.BUMP_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          released="${TAG#v}"
          if ! printf '%s' "$released" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::${TAG} is not a plain vX.Y.Z tag, so what comes after it is a choice; bump by hand"
            echo "::notice::the migration notes stay in docs/migration/unreleased/ for the release that follows ${TAG}"
            exit 0
          fi
          next="${released%.*}.$(( 10#${released##*.} + 1 ))"

          # The tag's tree says which migration notes this release shipped.
          git fetch --quiet --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          key_file="$(mktemp)"
          chmod 600 "${key_file}"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${DEPLOY_KEY:-}" > "${key_file}"
          export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))

            # Decide against main as it is now, not as it was when this run
            # started. A build takes long enough for main to move under it, and
            # a retry after a refused push has to see what refused it.
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD

            current="$(awk -F'"' '
              /^\[package\]/ { in_section = 1; next }
              /^\[/          { in_section = 0 }
              in_section && /^version[[:space:]]*=/ { print $2; exit }
            ' Cargo.toml)"
            if [ -z "$current" ]; then
              echo "release.yml: no [package] version in Cargo.toml" >&2
              exit 1
            fi

            scripts/release-fragments.sh "$TAG"

            # A bump that already landed, or a re-run of an older release after
            # later ones went out. Either way main is where it should be or
            # further on, and bumping would walk it backwards.
            bump="$next"
            oldest="$(printf '%s\n%s\n' "$current" "$next" | sort -V | head -1)"
            if [ "$current" = "$next" ] || [ "$oldest" = "$next" ]; then
              echo "::notice::main is at ${current}, at or past ${next}; nothing to bump"
              bump=""
            fi

            if [ -z "$bump" ] && git diff --cached --quiet; then
              echo "::notice::no version to bump and no migration notes to file"
              exit 0
            fi
            by_hand="scripts/release-fragments.sh ${TAG}"
            if [ -n "$bump" ]; then
              by_hand="${by_hand} and scripts/bump-version.py ${bump}"
            fi

            # Failing here rather than reporting and stopping. Without the push
            # main goes on calling itself a version that is already released,
            # or holding notes that shipped as unreleased, and either is wrong
            # the next time a tag is cut, so this has to be visible on the
            # release run.
            if [ -z "${DEPLOY_KEY:-}" ]; then
              echo "release.yml: BUMP_DEPLOY_KEY is not set, so main is left as it was while ${TAG} is out." >&2
              echo "Add the secret and re-run this workflow, or run ${by_hand} on main by hand." >&2
              exit 1
            fi

            if [ -n "$bump" ]; then
              python3 scripts/bump-version.py "$bump"
              if git diff --quiet; then
                echo "release.yml: bump-version.py changed nothing on the way to ${bump}" >&2
                exit 1
              fi
              git commit -qam "chore: set the version to ${bump}"
              done_what="main is at ${bump}"
            else
              git commit -qm "docs: file the migration notes that shipped in ${TAG}"
              done_what="the migration notes are filed under ${TAG}"
            fi

            if git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main; then
              echo "$done_what"
              exit 0
            fi

            if [ "$attempt" -ge 3 ]; then
              echo "release.yml: pushing to main was refused, so main is left as it was while ${TAG} is out." >&2
              echo "Either main is moving faster than this job can follow, or the deploy key is not a bypass actor on the main ruleset." >&2
              echo "Fix the bypass and re-run this workflow, or run ${by_hand} on main by hand." >&2
              exit 1
            fi
            echo "::notice::the push was refused; taking main again and re-deciding"
          done
