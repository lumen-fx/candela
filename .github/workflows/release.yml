name: release

# Publishes the candela toolchain to a GitHub release on any vX.Y.Z tag.
#
# The assets come from build-artifacts.yml, which nightly.yml calls too. What
# is here is the part only a tag does: check the tag against the manifest,
# publish the release, and open the pull request that moves main to the next
# version, so tagging is the only thing cutting a release asks anyone to type
# and merging that pull request is the only thing it asks afterwards.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Every artifact is named after the tag and versioned from the manifest, so a
  # tag that disagrees with the manifest ships a package claiming a version the
  # binary does not report. This gates the build rather than running inside it,
  # so a disagreement costs one runner instead of every leg of the matrix.
  #
  # Both binaries ship in the same archive and report their own version, so
  # vm/Cargo.toml is checked alongside the root manifest. The version is read
  # out of the `[package]` table rather than off a line number, which a comment
  # above it moves.
  version:
    name: check the tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Read the version off the tag
        id: read
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest_path in Cargo.toml vm/Cargo.toml; do
            manifest="$(awk -F'"' '
              /^\[package\]/ { in_section = 1; next }
              /^\[/          { in_section = 0 }
              in_section && /^version[[:space:]]*=/ { print $2; exit }
            ' "$manifest_path")"
            if [ "$tag" != "$manifest" ]; then
              echo "Tag $GITHUB_REF_NAME is version '$tag', but $manifest_path says '$manifest'."
              echo "Run scripts/bump-version.py $tag, or retag, so the two agree."
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  artifacts:
    name: build
    needs: version
    uses: ./.github/workflows/build-artifacts.yml
    with:
      msi_version: ${{ needs.version.outputs.version }}

  release:
    name: publish release
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.msi
            artifacts/sha256sums.txt
          generate_release_notes: true

  # Cutting a release is a tag push and nothing else, so the version main
  # carries has to move afterwards on its own. This opens the pull request that
  # moves it, which leaves merging as the last thing a release asks of anyone.
  #
  # The next version is always the next patch. Nothing here can know whether the
  # work after this release is a fix or a feature, and being predictable is
  # worth more than being right: a number that is always one patch ahead is
  # corrected by editing the branch, while a number that follows a rule somebody
  # has to remember is not. Tags in any other shape, a prerelease among them,
  # are left alone, because incrementing one is a decision rather than an
  # increment.
  #
  # Re-running the workflow after fixing a build leg reaches this job again, and
  # it lands on the branch and the number it did the first time, so there is one
  # pull request however many times it runs. Once that pull request is merged,
  # main is already at the next version and a later re-run stops before it
  # commits anything, which is also what keeps a re-run of an older release from
  # walking main backwards.
  #
  # Only main moves here. publish.yml and publish-extensions.yml run off the
  # release and check out the tag, so neither is disturbed by main moving under
  # them.
  bump:
    name: open the version bump
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Open the pull request that moves main to the next version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          released="${TAG#v}"
          if ! printf '%s' "$released" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::${TAG} is not a plain vX.Y.Z tag, so what comes after it is a choice; bump by hand"
            exit 0
          fi
          next="${released%.*}.$(( 10#${released##*.} + 1 ))"

          current="$(awk -F'"' '
            /^\[package\]/ { in_section = 1; next }
            /^\[/          { in_section = 0 }
            in_section && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          if [ -z "$current" ]; then
            echo "release.yml: no [package] version in Cargo.toml" >&2
            exit 1
          fi

          # A merged bump, or a re-run of an older release after later ones went
          # out. Either way main is where it should be or further on, and
          # bumping would walk it backwards.
          oldest="$(printf '%s\n%s\n' "$current" "$next" | sort -V | head -1)"
          if [ "$current" = "$next" ] || [ "$oldest" = "$next" ]; then
            echo "::notice::main is at ${current}, at or past ${next}; nothing to bump"
            exit 0
          fi

          python3 scripts/bump-version.py "$next"
          if git diff --quiet; then
            echo "release.yml: bump-version.py changed nothing on the way to ${next}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: set the version to ${next}"

          branch="bump-version-${next}"
          git push -f origin "HEAD:refs/heads/${branch}"
          if gh pr list --head "${branch}" --json number --jq '.[].number' | grep -q .; then
            echo "::notice::the pull request for ${next} is already open, and now carries this run's commit"
            exit 0
          fi
          gh pr create --head "${branch}" \
            --title "chore: set the version to ${next}" \
            --body "$(cat <<BODY
          ${TAG} is out, so main is free to move on. \`scripts/bump-version.py\` set
          the version to ${next} everywhere the tree writes it out: the two crates
          the release ships, the pin between them, and \`Cargo.lock\`.

          Merging this means a build from main calls itself ${next}, which is the
          version the next release gets tagged as. The number stays inert until that
          tag exists, because every version-keyed lookup resolves through the
          releases page rather than through what a binary says it is.

          To go somewhere other than the next patch, run that script with the version
          you want and push to this branch.
          BODY
          )"
