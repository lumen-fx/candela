name: Check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The action defaults RUSTFLAGS to "-D warnings". Warnings are
          # denied by the clippy job below instead, which reports them with
          # the lint name attached.
          rustflags: ""

      - name: Check
        run: cargo check

      - name: Check (embed)
        run: cargo check --features embed

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ""

      - name: Formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""

      # --workspace reaches candela-vm and candela-lsp, which default-members
      # keeps out of a plain cargo command at the repo root.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (embed)
        run: cargo clippy --features embed --all-targets -- -D warnings
