name: Check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The action defaults RUSTFLAGS to "-D warnings", which would
          # fail the build on pre-existing warnings. Keep warnings as
          # warnings; this check only guards against compile errors.
          rustflags: ""

      - name: Check
        run: cargo check

      - name: Check (embed)
        run: cargo check --features embed
