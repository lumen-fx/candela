name: build-package self-test

# Runs the reusable package workflow against the example package in this
# repository, so a change to build-package.yml is exercised before anyone
# else's release depends on it.
#
# There is no tag here, so the publish half of that workflow skips itself and
# what runs is the install, the check, and the pack.

on:
  pull_request:
    paths:
      - ".github/workflows/build-package.yml"
      - ".github/workflows/build-package-selftest.yml"
      - "examples/package/**"
      - "install.sh"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    uses: ./.github/workflows/build-package.yml
    with:
      # The self-test checks the workflow against the toolchain built from
      # main, which is what the nightly channel is.
      candela-version: nightly
      # A pure-candela package packs for `any`, and one runner would never
      # reach the Windows install, which is the leg that installs from the
      # release rather than through install.sh. Packing for Windows as well
      # costs one more runner and exercises it.
      targets: any windows-x86_64
      manifest-path: examples/package/candela.toml
