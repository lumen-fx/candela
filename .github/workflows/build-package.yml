name: build package

# Packs a candela package, publishes it to a GitHub release, and tells the
# registry where the release is. A package repository calls this instead of
# writing the same three steps itself:
#
#   permissions:
#     contents: write
#
#   jobs:
#     release:
#       uses: lumen-fx/candela/.github/workflows/build-package.yml@main
#       with:
#         candela-version: latest
#       secrets:
#         lpm-token: ${{ secrets.LPM_TOKEN }}
#
# A pure-candela package needs nothing else. One that ships native libraries
# names the command that builds them, and the pack runs once per desktop target
# so each archive carries the libraries for the machine that will run it.
#
# The publish half runs only for a tag. Called from a pull request, this builds
# and packs and stops, which is what the self-test does.

on:
  workflow_call:
    inputs:
      candela-version:
        description: >-
          The candela release to build against: a version, `latest`, or the
          `nightly` channel.
        required: true
        type: string
      native-build:
        description: >-
          A command run in the package root on each target, leaving the native
          libraries it builds in `dist/`. Setting it makes the pack run once
          per desktop target instead of once for `any`.
        required: false
        type: string
        default: ""
      targets:
        description: >-
          The targets to pack for, space or comma separated. Defaults to `any`,
          or to the five desktop targets when `native-build` is set.
        required: false
        type: string
        default: ""
      manifest-path:
        description: The package manifest, relative to the repository root.
        required: false
        type: string
        default: candela.toml
    secrets:
      lpm-token:
        description: A registry token with permission to release this package.
        required: false

# Permissions come from the caller: a called workflow cannot ask for more than
# it was granted, so nothing is declared here. A release caller grants
# `contents: write` for the release it creates; a self-test on a pull request
# grants read and runs everything up to the publish.

jobs:
  # What to build, and where. The matrix is data rather than a literal list so
  # a pure-candela package costs one runner and a native one costs five.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      name: ${{ steps.read.outputs.name }}
      version: ${{ steps.read.outputs.version }}
      description: ${{ steps.read.outputs.description }}
      entry: ${{ steps.read.outputs.entry }}
    steps:
      - uses: actions/checkout@v6

      - name: Read the manifest
        id: read
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest-path }}
        run: |
          set -euo pipefail
          [ -f "$MANIFEST" ] || { echo "no manifest at $MANIFEST" >&2; exit 1; }
          # TOML spells a string with either quote character, so both come off
          # and whatever follows the closing one, comment included, goes with
          # them.
          read_key() {
            awk -v key="$1" '
              /^[[:space:]]*\[/ { inside = ($0 ~ /^[[:space:]]*\[package\][[:space:]]*$/); next }
              inside && $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                sub(/^[^=]*=[[:space:]]*/, "")
                sub(/[[:space:]]+$/, "")
                quote = substr($0, 1, 1)
                if (quote == "\"" || quote == "'"'"'") {
                  sub("^" quote, "")
                  sub(quote ".*$", "")
                }
                print
                exit
              }' "$MANIFEST"
          }
          name="$(read_key name)"
          version="$(read_key version)"
          [ -n "$name" ] || { echo "$MANIFEST has no name in [package]" >&2; exit 1; }
          [ -n "$version" ] || { echo "$MANIFEST has no version in [package]" >&2; exit 1; }
          # The entry is the package's front door: the verbs compile it and an
          # import of this package by name reads it, so the pack packs the
          # directory it sits in. The default below mirrors candela's own,
          # `DEFAULT_ENTRY` in src/manifest.rs; this job runs before the
          # toolchain is installed, so it cannot ask for it.
          entry="$(read_key entry)"
          [ -n "$entry" ] || entry="src/main.cdl"
          {
            echo "name=$name"
            echo "version=$version"
            echo "description=$(read_key description)"
            echo "entry=$entry"
          } >> "$GITHUB_OUTPUT"
          echo "$name $version, entry $entry"

      - name: Work out the targets
        id: plan
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          NATIVE: ${{ inputs.native-build }}
        run: |
          set -euo pipefail
          targets="$TARGETS"
          if [ -z "$targets" ]; then
            if [ -n "$NATIVE" ]; then
              targets="linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64"
            else
              targets="any"
            fi
          fi
          entries=""
          for target in $(printf '%s' "$targets" | tr ',' ' '); do
            case "$target" in
              any|linux-x86_64) runner=ubuntu-latest ;;
              linux-aarch64) runner=ubuntu-24.04-arm ;;
              macos-x86_64) runner=macos-26-intel ;;
              macos-aarch64) runner=macos-latest ;;
              windows-x86_64) runner=windows-latest ;;
              *)
                echo "unknown target $target. Known: any, linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64, windows-x86_64" >&2
                exit 1
                ;;
            esac
            entries="$entries{\"target\":\"$target\",\"runner\":\"$runner\"},"
          done
          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"
          echo "targets: $targets"

  pack:
    name: pack (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      # The installer covers Linux and macOS, and knows a channel from a
      # version. Windows installs from the release directly: a tagged release
      # from its installer, a channel from its zip, since the rolling
      # prerelease publishes no installer. Either way the toolchain comes from
      # a release, so the package is checked against a candela a user can have.
      - name: Install candela
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.candela-version }}
        run: |
          set -euo pipefail
          if [ "$VERSION" = latest ]; then
            curl -fsSL https://candela.lumenfx.dev/install.sh |
              sh -s -- --no-confirm --no-modify-path
          else
            curl -fsSL https://candela.lumenfx.dev/install.sh |
              sh -s -- --version "$VERSION" --no-confirm --no-modify-path
          fi
          echo "$HOME/.candela" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install candela
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.candela-version }}
        run: |
          $releases = 'https://github.com/lumen-fx/candela/releases'
          # `latest` and a version name a tagged release, which carries the
          # installer. Anything else is a channel: its tag is the name as
          # given, without the `v` a version tag takes, and it carries a zip
          # and no installer.
          if ($env:VERSION -eq 'latest') {
            $base = "$releases/latest/download"
            $tagged = $true
          } elseif ($env:VERSION -match '^v?[0-9]') {
            $base = "$releases/download/v$($env:VERSION -replace '^v', '')"
            $tagged = $true
          } else {
            $base = "$releases/download/$($env:VERSION)"
            $tagged = $false
          }
          if ($tagged) {
            $installer = Join-Path $env:RUNNER_TEMP 'candela.msi'
            $log = Join-Path $env:RUNNER_TEMP 'install.log'
            Invoke-WebRequest -Uri "$base/candela-windows-x86_64.msi" -OutFile $installer
            $p = Start-Process msiexec -ArgumentList '/i', $installer, '/qn', '/l*v', $log -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $log
              throw "msiexec exited with $($p.ExitCode)."
            }
            $dir = "$env:LOCALAPPDATA\Programs\Candela"
          } else {
            # The zip holds candela.exe and candela-vm.exe at its root, with
            # the libs/ the compiler reads std from beside them, so unpacking
            # it is the whole install.
            $archive = Join-Path $env:RUNNER_TEMP 'candela.zip'
            $dir = Join-Path $env:RUNNER_TEMP 'candela'
            Invoke-WebRequest -Uri "$base/candela-windows-x86_64.zip" -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force
            if (-not (Test-Path (Join-Path $dir 'candela.exe'))) {
              throw "candela-windows-x86_64.zip from $($env:VERSION) holds no candela.exe."
            }
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Report the toolchain
        shell: bash
        run: candela --version

      - name: Build the native libraries
        if: inputs.native-build != ''
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NATIVE: ${{ inputs.native-build }}
          MANIFEST: ${{ inputs.manifest-path }}
        run: |
          set -euo pipefail
          cd "$(dirname "$MANIFEST")"
          eval "$NATIVE"
          ls -l dist

      # Compiling the package is the check that it is shippable at all: every
      # import resolves, every type holds, and any dependency it lists is
      # reachable through the registry.
      - name: Check the package
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest-path }}
        run: |
          set -euo pipefail
          cd "$(dirname "$MANIFEST")"
          candela check

      - name: Pack
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest-path }}
          TARGET: ${{ matrix.target }}
          NAME: ${{ needs.plan.outputs.name }}
          ENTRY: ${{ needs.plan.outputs.entry }}
        run: |
          set -euo pipefail
          root="$(dirname "$MANIFEST")"
          manifest_name="$(basename "$MANIFEST")"
          archive="$PWD/$NAME-$TARGET.tar.gz"
          entry="$ENTRY"
          # The archive holds the package root and nothing above it, so an
          # entry that climbs out of the package cannot be packed. `candela
          # check` refuses one first; this is the same rule where the archive
          # is built.
          case "/$entry/" in
            */../*)
              echo "$MANIFEST names the entry $entry, and an entry cannot leave the package with .." >&2
              exit 1
              ;;
          esac
          if [ ! -f "$root/$entry" ]; then
            echo "$MANIFEST names the entry $entry, and there is no file there" >&2
            exit 1
          fi
          # The package root sits at the root of the archive, so unpacking it
          # gives a directory with candela.toml at the top, which is what the
          # registry client expects to find. What ships beside the manifest is
          # the directory holding the entry, because that is what an import of
          # this package reads: the name alone reads the entry file, and a path
          # reads the files beside it.
          members=("$manifest_name")
          entry_dir="$(dirname "$entry")"
          if [ "$entry_dir" = "." ]; then
            # The entry sits at the package root, so the package is its own
            # entry directory and everything beside the manifest ships. Out go
            # build output and the archives an earlier run left. A name that
            # starts with a dot never ships either: the glob does not match
            # one, which is what keeps `.git`, `.github` and `.gitignore` out
            # of the archive.
            for item in "$root"/*; do
              [ -e "$item" ] || continue
              member="$(basename "$item")"
              case "$member" in
                "$manifest_name" | dist | target | *.tar.gz | *.tgz | *.zip) continue ;;
              esac
              members+=("$member")
            done
          else
            members+=("$entry_dir")
          fi
          # dist/ ships whenever the package has one, and an entry directly in
          # it has already put it on the list.
          if [ -d "$root/dist" ] && [ "$entry_dir" != dist ]; then
            members+=("dist")
          fi
          tar -czf "$archive" -C "$root" "${members[@]}"
          tar -tzf "$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ needs.plan.outputs.name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Only a tag publishes. A pull request stops after the pack above, which is
  # the whole of the self-test.
  release:
    name: release
    needs: [plan, pack]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Check the tag against the manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tagged="${TAG#v}"
          case "$tagged" in
            [0-9]*)
              if [ "$tagged" != "$VERSION" ]; then
                echo "tag $TAG does not match the manifest version $VERSION" >&2
                exit 1
              fi
              ;;
            *) echo "tag $TAG is not a version; releasing $VERSION from the manifest" ;;
          esac

      - name: Checksum the archives
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*.tar.gz | sed 's| \./| |' > sha256sums.txt
          cat sha256sums.txt

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$NAME $VERSION" \
            --notes "Install with: candela add $NAME" \
            artifacts/*

      # The client comes from the toolchain installer, which resolves and
      # verifies it exactly as candela itself does. Nothing here repeats that.
      - name: Install candela and the registry client
        shell: bash
        env:
          VERSION: ${{ inputs.candela-version }}
        run: |
          set -euo pipefail
          if [ "$VERSION" = latest ]; then
            curl -fsSL https://candela.lumenfx.dev/install.sh |
              sh -s -- --no-confirm --no-modify-path
          else
            curl -fsSL https://candela.lumenfx.dev/install.sh |
              sh -s -- --version "$VERSION" --no-confirm --no-modify-path
          fi
          echo "$HOME/.candela" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tell the registry where the release is
        shell: bash
        env:
          LPM_TOKEN: ${{ secrets.lpm-token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
          DESCRIPTION: ${{ needs.plan.outputs.description }}
          MANIFEST: ${{ inputs.manifest-path }}
        run: |
          set -euo pipefail
          if [ -z "${LPM_TOKEN:-}" ]; then
            echo "no lpm-token secret; the release is published but the registry was not told" >&2
            exit 1
          fi

          # lpm takes its token from the config file `lpm login` writes, at
          # $LPM_CONFIG_DIR/config.json, so this writes that file. No released
          # lpm reads LPM_TOKEN from the environment; it stays exported because
          # it costs nothing and a client that grows the habit needs no change
          # here. The file carries the secret, so it is created unreadable to
          # anyone else and removed when the step ends or the job is cancelled.
          config_dir="$RUNNER_TEMP/lpm"
          rm -rf "$config_dir"
          mkdir -p "$config_dir"
          chmod 700 "$config_dir"
          trap 'rm -rf "$config_dir"' EXIT INT TERM
          (
            umask 077
            # The registry lpm itself defaults to, spelled out because the
            # config file the token goes in names one.
            printf '{"registry": "%s", "token": "%s"}\n' \
              "https://reg.lumenfx.dev" "$LPM_TOKEN" \
              > "$config_dir/config.json"
          )
          chmod 600 "$config_dir/config.json"
          export LPM_CONFIG_DIR="$config_dir"

          # A package the registry has never heard of is registered first. One
          # it already knows is refused, which is the answer this wanted. The
          # two phrases below are the only ones that mean a taken name: the
          # registry's own message, and what lpm says instead when the refusal
          # arrives without the JSON body it expects. Anything wider swallows a
          # real failure and releases against a package nobody registered.
          # `already_registered` in src/cli.rs matches the same two.
          if ! lpm publish "$NAME" --platform candela --description "$DESCRIPTION" 2> publish.err; then
            if ! grep -qiE 'package name is already taken|the registry answered 409' publish.err; then
              cat publish.err >&2
              exit 1
            fi
          fi

          args=""
          for archive in artifacts/*.tar.gz; do
            asset="$(basename "$archive")"
            target="${asset#"$NAME"-}"
            target="${target%.tar.gz}"
            args="$args --artifact $target=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset"
          done

          # Every dependency the manifest lists travels with the release, so the
          # registry can resolve this package for whoever depends on it. Either
          # quote character comes off and whatever follows the closing one goes
          # with it, the same way a [package] key is read, so a literal string
          # and a trailing comment both reach the registry as the requirement
          # alone. The table form is read down to its version first, which
          # leaves the closing brace on the tail.
          deps="$(awk '
            /^[[:space:]]*\[/ { inside = ($0 ~ /^[[:space:]]*\[dependencies\][[:space:]]*$/); next }
            inside && /=/ {
              name = $0; sub(/[[:space:]]*=.*/, "", name); gsub(/[[:space:]]/, "", name)
              req = $0; sub(/^[^=]*=[[:space:]]*/, "", req)
              if (req ~ /^\{/) { sub(/^.*version[[:space:]]*=[[:space:]]*/, "", req) }
              quote = substr(req, 1, 1)
              if (quote == "\"" || quote == "'"'"'") {
                sub("^" quote, "", req)
                sub(quote ".*$", "", req)
              }
              if (name != "" && req != "") printf " --dep %s@%s", name, req
            }' "$MANIFEST")"

          # The release says which candela a user needs. The manifest says so
          # when its author named one, as a version with an optional comparator
          # in front, and that is what the registry records: a package
          # checked on the nightly channel otherwise demands the in-development
          # version, which has no release and so no users. With no key to read,
          # the compiler that checked the package is the only evidence there is,
          # taken from the binary rather than the input, since `latest` and
          # `nightly` are channels and not versions.
          # Either quote character comes off, and whatever follows the closing
          # one goes with it, the same way the plan job reads a key.
          required="$(awk '
            /^[[:space:]]*\[/ { inside = ($0 ~ /^[[:space:]]*\[package\][[:space:]]*$/); next }
            inside && /^[[:space:]]*candela[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, "")
              sub(/[[:space:]]+$/, "")
              quote = substr($0, 1, 1)
              if (quote == "\"" || quote == "'"'"'") {
                sub("^" quote, "")
                sub(quote ".*$", "")
              }
              print
              exit
            }' "$MANIFEST")"
          if [ -n "$required" ]; then
            host="candela@$required"
            echo "$MANIFEST requires $host"
          else
            host="candela@>=$(candela --version | awk '{ print $2 }')"
            echo "$MANIFEST names no candela requirement; recording the one it was checked with, $host"
          fi

          # shellcheck disable=SC2086
          lpm release "$NAME" "$VERSION" $args $deps --requires "$host" -d "$DESCRIPTION"
