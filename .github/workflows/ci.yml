name: Cargo Build & Test

on:
  push:
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--features embed"]
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable && rustup default stable
      - run: cargo build --verbose ${{ matrix.features }}
      - run: cargo test --verbose ${{ matrix.features }}
  build_and_test_crates:
    # A plain cargo command at the repo root builds and tests the `candela`
    # package alone, because default-members says so. The other two workspace
    # members are named here so their tests run as well.
    name: Workspace crates - candela-vm, candela-lsp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable && rustup default stable
      - run: cargo build --verbose -p candela-vm -p candela-lsp
      - run: cargo test --verbose -p candela-vm
      - run: cargo test --verbose -p candela-lsp
  build_and_test_wasm:
    name: (WASM) Rust project - latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - run: cargo build --verbose --target wasm32-unknown-unknown
