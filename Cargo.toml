[package]
# The crates.io name is `candela-lang`, because `candela` on crates.io is an
# unrelated crate from 2020. Everything a user sees stays `candela`: the library
# is `[lib] name = "candela"` so `use candela::...` compiles unchanged, and the
# command-line tool is `[[bin]] name = "candela"`. Inside this workspace the
# dependency is written `candela = { package = "candela-lang", ... }`.
name = "candela-lang"
version = "0.0.7"
edition = "2024"
authors = [
    "Horace Hoff <horace.hoff@gmail.com>",
    "FizzWizzleDazzle <arturmisiurev@gmail.com>",
]
description = "The candela scripting language: compiler front-end, embedding API, and the candela command-line tool. Statically typed, compiles to bytecode for the candela-vm runtime."
readme = "README.md"
repository = "https://github.com/lumen-fx/candela"
homepage = "https://github.com/lumen-fx/candela"
license = "Apache-2.0"
documentation = "https://docs.rs/candela-lang"
keywords = ["candela", "scripting", "language", "interpreter", "embedded"]
categories = ["compilers", "development-tools"]
# The repository root carries things a published crate has no use for: the
# artwork, the VS Code extension, the docs site sources, the installer, the MSI
# and PGO inputs. Source, tests, the standard library, and the licenses ship.
exclude = [
    "assets/",
    "docs/",
    "editors/",
    "msi/",
    "pgo/",
    "scripts/",
    "about.hbs",
    "about.toml",
    "install.sh",
    "BENCHMARKS.md",
]

# This manifest is both the `candela-lang` package (compiler front-end + CLI)
# and the workspace root. Two extra members:
#   * `vm` (crate `candela-vm`): the self-contained runtime core. `candela`
#     DEPENDS ON it (strictly candela -> candela-vm), and its `candela-vm`
#     binary and this crate's `candela` binary share that one VM implementation.
#     That direction is why candela-vm publishes too: crates.io takes no crate
#     whose dependencies are absent from the registry.
#   * `lsp` (crate `candela-lsp`): the language server. It depends on this crate
#     as a plain library (one-way, lsp -> candela, never the reverse) to reuse
#     the lexer/parser/type-checker; its tooling deps (tower-lsp, tokio, ...)
#     never touch this crate's dependency graph or the `candela` binary. It is
#     `publish = false`; nothing published depends on it.
# `default-members` keeps plain `cargo build` at the repo root building only the
# `candela-lang` package (build `-p candela-vm` / `-p candela-lsp` explicitly).
[workspace]
members = ["lsp", "vm"]
default-members = ["."]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
perf = { level = "warn", priority = 1 }
implicit_clone = "warn"
str_to_string = "warn"
format_push_string = "warn"
verbose_file_reads = "warn"
mem_forget = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
too_many_lines = "allow"
redundant_closure_for_method_calls = "allow"
doc_markdown = "allow"
option_if_let_else = "allow"
inline_always = "allow"
similar_names = "allow"
many_single_char_names = "allow"
clone_on_ref_ptr = "allow"
wildcard_imports = "allow"
items_after_statements = "allow"
ref_as_ptr = "allow"
ptr_as_ptr = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
redundant_clone = "warn"
redundant_else = "allow"

[features]
default = ["compiler"]
# The compiler front-end: parser, code generator, type checker, REPL, the
# `Engine`/`Program` embedding API, and the `candela build` subcommand. This is
# effectively always on (the runtime core it used to gate now lives in the
# separate `candela-vm` crate); the feature is retained so `candela-lsp` and the
# `candela` binary opt into `logos`/`mimalloc` explicitly.
compiler = ["dep:logos", "dep:mimalloc"]
embed = ["candela-vm/embed"]

[dependencies]
# The self-contained runtime core. Strict dependency direction: candela ->
# candela-vm (never the reverse). The full `candela` binary compiles this one VM
# into itself via this dep, so the VM is never duplicated.
candela-vm = { path = "vm", version = "0.0.7" }
smol_strc = "0.3.6"
ariadne = "0.6.0"
memchr = "2.8.3"
lexical-core = "1.0.6"
logos = { version = "0.16.1", optional = true }
rustc-hash = "2.1.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.9.0"
libffi = "5.1.1"
mimalloc = { version = "0.1.52", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned to the locked version rather than `*`: crates.io rejects a wildcard
# requirement, and this crate publishes.
wasm-bindgen = "0.2.126"
getrandom = { version = "0.3.4", features = ["wasm_js"] }

# Integration tests probe dyn-lib availability through the same OS loader the
# runtime uses, so they can skip cleanly when a system library is absent.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
libloading = "0.9.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
# `candela`, not the package name: this is the import path every embedder and
# every crate in this workspace writes as `use candela::...`.
name = "candela"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# Named explicitly so the tool stays `candela` regardless of the package name.
[[bin]]
name = "candela"
path = "src/main.rs"

[profile.dev]
opt-level = 1
debug = false
strip = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'abort'
debug = false
rpath = false
strip = true
debug-assertions = false
incremental = false

[profile.release.package."*"]
opt-level = 3
debug = false
codegen-units = 1
incremental = false
strip = true

# The VM-only `candela-vm` binary is tuned for size by the workspace `release`
# profile's whole-artifact levers (panic = "abort", lto = "fat",
# codegen-units = 1, strip = true) and by building only the self-contained
# `candela-vm` crate (no parser/compiler/REPL, no `logos`/`mimalloc`). That
# already lands it well under 1 MiB. A per-package `opt-level = "z"` override was
# measured and made the binary LARGER, so no override is applied. The `candela`
# library stays at opt-level 3, which also keeps the full `candela` compiler+VM
# binary fast.

[profile.debugrelease]
inherits = "release"
lto = true
strip = false
codegen-units = 1
opt-level = 3
debug = 2
debug-assertions = false
panic = "abort"
rpath = true
incremental = false

[profile.debugrelease.package."*"]
opt-level = 3
debug = 2
codegen-units = 1

[profile.embed]
inherits = "release"
panic = "unwind"

[profile.embed.package."*"]
opt-level = 3
debug = false
codegen-units = 1
incremental = false
strip = true