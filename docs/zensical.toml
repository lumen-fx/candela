# Zensical configuration for the Candela documentation.
#
# Build a static site into `site/`:
#
#   uv run zensical build --strict
#
# The theme block mirrors the Lumen docs so both doc sets look the same when
# they are combined at docs.lumenfx.dev.

[project]

site_name = "Candela Docs"
site_description = "Documentation for candela, the scripting language of the Lumen UI framework."
site_author = "Lumen FX"
site_url = "https://candela.lumenfx.dev"

repo_url = "https://github.com/lumen-fx/candela"
repo_name = "lumen-fx/candela"
edit_uri = "edit/main/docs/docs/"

copyright = """
Copyright &copy; 2026 Lumen FX &middot; Candela is a fork of keel by Horace Hoff
"""

nav = [
  {"Introduction" = "index.md"},
  {"Getting started" = [
     "getting-started/install.md",
     "getting-started/hello-world.md",
     "getting-started/running.md",
  ]},
  {"Language" = [
     "language/variables.md",
     "language/types.md",
     "language/control-flow.md",
     "language/functions.md",
     "language/methods.md",
     "language/enums.md",
     "language/collections.md",
     "language/error-handling.md",
     "language/modules.md",
  ]},
  {"Standard library" = [
     "standard-library/overview.md",
     "standard-library/builtins.md",
     "standard-library/assert.md",
     "standard-library/convert.md",
     "standard-library/json.md",
     "standard-library/list.md",
     "standard-library/map.md",
     "standard-library/math.md",
     "standard-library/option.md",
     "standard-library/random.md",
     "standard-library/result.md",
     "standard-library/set.md",
     "standard-library/string.md",
     "standard-library/time.md",
  ]},
  {"Reference" = [
     "reference/operators.md",
     "reference/errors.md",
     "reference/cli.md",
     "reference/artifacts.md",
  ]},
  {"Integration" = [
     "integration/embedding.md",
     "integration/c-libraries.md",
  ]},
  {"Lumen bindings" = "https://docs.lumenfx.dev/reference/scripting-candela/"},
  {"Contributing" = [
     "contributing/building.md",
  ]},
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

language = "en"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
accent = "blue"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "blue"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Extra
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lumen-fx/candela"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
toc_depth = "2-3"
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.zensical.extensions.glightbox]
auto = true
[project.markdown_extensions.zensical.extensions.preview]
configurations = [
    { targets.include = [
        "*.md"
    ]}
]
