# The native half of the `archive` package: unpacks zip, tar and tar.gz files
# on a thread of its own and reports through the program's event queue. Built
# as the shared library the package's candela code binds through
# `dylib "../dist/archive"`.
[package]
name = "candela-archive"
# Never published: a package is versioned by its candela.toml, which moves
# with candela's own version.
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The native half of candela's archive package."

[lib]
# The release job copies the built library into the package as
# `dist/archive.<ext>`.
name = "candela_archive"
crate-type = ["cdylib", "rlib"]

[dependencies]
candela-package-sys = { path = "../../sys" }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
candela-package-testkit = { path = "../../testkit" }
