[package]
name = "candela-vm"
version = "0.0.5"
edition = "2024"
authors = [
    "Horace Hoff <horace.hoff@gmail.com>",
    "FizzWizzleDazzle <arturmisiurev@gmail.com>",
]
readme = "README.md"
repository = "https://github.com/lumen-fx/candela"
homepage = "https://github.com/lumen-fx/candela"
license = "Apache-2.0"
description = "VM-only runtime for candela: the executor, bytecode and data types, value marshalling, and the .cdlb load/run API. Self-contained; it depends on nothing from the compiler crate."
keywords = ["candela", "vm", "bytecode", "interpreter", "runtime"]
categories = ["development-tools"]

# This is the SELF-CONTAINED runtime core. It links no parser, compiler, or
# REPL and depends on NOTHING from the `candela` (compiler) crate; the
# dependency direction is strictly candela -> candela-vm. Both the `candela-vm`
# binary (a `[[bin]]` here) and the full `candela` compiler binary use this one
# VM implementation, so the VM is never duplicated.
[lib]
name = "candela_vm"
path = "src/lib.rs"

[[bin]]
name = "candela-vm"
path = "src/bin/candela-vm.rs"

[lints.clippy]
# The VM's hot paths thread their state as explicit borrowed arguments instead
# of a context struct; the compiler crate makes the same choice (see the
# root manifest).
too_many_arguments = "allow"

[features]
# Build the runtime for life inside a host process: a fatal error unwinds
# instead of exiting, so the host stays alive and can catch it. Off by default,
# for the standalone binary that owns its process. Output routing is not part
# of this feature; a host redirects program output and error reports at runtime
# with `captured_output::set_capturing`.
embed = []

[dependencies]
smol_strc = "0.3.6"
ariadne = "0.6.0"
memchr = "2.8.3"
lexical-core = "1.0.6"
zmij = "1.0.21"
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.9.0"
libffi = "5.1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned to the locked version rather than `*`: crates.io rejects a wildcard
# requirement, and this crate publishes.
wasm-bindgen = "0.2.126"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
